# ~/.config/devvm/devvm.toml — one file, shared across hosts through dotfiles
# (stow --dotfiles: devvm/dot-config/devvm/devvm.toml). Hand-edited; devvm
# writes it only through `devvm config add/rm`.
#
# What is NOT here: smol VMs (discovered from `smolvm machine ls`) and
# Hetzner servers (discovered from the API). Only remote boxes and hubs
# need an entry. Per-host state (ports, caches, the Hetzner token) lives in
# ~/.local/state/devvm.

# ----------------------------------------------------------------------
# Templates: how `create` and `setup` shape a box. Unset fields fall back
# to [templates.default]. Sizes are create-time only and never stored.
# ----------------------------------------------------------------------

[templates.default]
hook = "url:https://raw.githubusercontent.com/smweber/dotfiles/master/bootstrap.sh --profile agent-vm --yes"
memory = 4096                    # smol, MiB; hetzner sizing is server_type:
                                 # `devvm providers types hetzner` lists types,
                                 # prices and what is sold out where
authorized_keys_github = ["smweber"]  # every server gets my GitHub keys
                                 # (harden is on by default; harden = false opts out)

[templates.niiyama]
fail2ban = true
location = "hel1"
server_type = "cpx22" # Helsinki, 2CPU 4GB €16.49
memory = 4096
repos = [
  "smweber/gleam_webstack", "smweber/deploy_webstack", "smweber/recipe2",
  "smweber/devvm", "smweber/my-deployments", "smweber/baseball",
  "smweber/travel", "smweber/projects", "smweber/mathgames",
]

[templates.anytime]
fail2ban = true
location = "hel1"
server_type = "cpx32" # Helsinki, 4CPU 8GB €29.99
memory = 6144
repos = ["Anytime-Automation-Labs-Inc/anytime-stack-workspace"]

# devvm's starter hook, to try what a new user gets: `devvm create NAME -t
# minimal`. hook.sh is the script beside this file (a copy of the starter
# create's form writes): packages, a tmux status line, a few shell lines.
[templates.minimal]
hook = "file:hook.sh"

# ----------------------------------------------------------------------
# Providers: `devvm create NAME --backend hetzner` makes a server here.
# The API token is per host: `devvm providers token hetzner` (0600 file in
# ~/.local/state/devvm/providers/), or HCLOUD_TOKEN. Use a project that
# holds nothing but devvm boxes.
# ----------------------------------------------------------------------

[providers.hetzner]
#location = "hel1"
#location = "nbg1"
image = "ubuntu-24.04"
ssh_key_file = "~/.ssh/id_ed25519.pub"   # uploaded once per key as devvm-<hash>

# ----------------------------------------------------------------------
# Remote boxes and hubs: devvm connects to them and never shapes them. It
# writes nothing there beyond ~/.ssh, except its agent in ~/.local/bin on an
# entry with `agent = true` (the browser bridge). `host` is host[:port] or
# an ssh alias; `user` unset lets ~/.ssh/config decide.
# ----------------------------------------------------------------------

[machines.anytime-staging-1]     # work box
backend = "remote"
agent = true
host = "anytime-staging-1"       # ssh alias
user = "dev"

[machines.scottdev3]
backend = "remote"
agent = true
host = "scottdev3"
mosh_server = "/home/linuxbrew/.linuxbrew/bin/mosh-server"
