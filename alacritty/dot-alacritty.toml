
[env]
TERM = "xterm-256color"

[font]
size = 11.5

[font.bold]
family = "MesloLGSDZ Nerd Font"
style = "Bold"

[font.bold_italic]
family = "MesloLGSDZ Nerd Font"
style = "Bold Italic"

[font.italic]
family = "MesloLGSDZ Nerd Font"
style = "Italic"

[font.normal]
family = "MesloLGSDZ Nerd Font"
style = "Regular"

[window]
decorations = "buttonless"
dynamic_padding = true

[window.padding]
x = 5
y = 5

[general]
live_config_reload = true

# Theme is chosen by `toggledark`, which copies the light/dark catppuccin theme
# over ~/.alacritty-theme.toml (untracked) so this config is never rewritten.
# catppuccin.toml first is the default (dark) until the override is written; the
# later import wins, and a missing override is only a harmless warning.
import = [
    "~/.config/alacritty/themes/themes/catppuccin.toml",
    "~/.alacritty-theme.toml",
]
